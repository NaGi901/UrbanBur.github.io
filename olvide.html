<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Urban Burgers</title>
    <link rel="stylesheet" href="css/olv.css">
</head>
<body>

    <div class="recuperar">
        <img src="imagenes/logo.png" alt="Logo Urban Burgers">

        <h1>¿Olvidaste tu contraseña?</h1>

        <p>
            No te preocupes. Escribe tu correo electrónico
            para iniciar la recuperación de tu cuenta.
        </p>

        <form>
            <input type="email" placeholder="Tu correo electrónico" required>

            <button type="submit">Recuperar contraseña</button>
        </form>

        <p>
            <a href="login.html">Volver al inicio de sesión</a>
        </p>
    </div>

</body>
</html>
